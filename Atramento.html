<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atramento</title>
<style>
  html {
    background: #000;
    width: 100%;
    height: 100%;
    overflow: scroll;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar {
    width: 0;
    background: transparent;
  }
  body {
    background: #000;
    color: #fff;
    font-family: "Times New Roman", Times, serif;
    font-size: 18px;
    text-align: left;
    line-height: 1.2;
    margin: 0 auto;
    box-sizing: border-box;
  }
  p {
    margin: 0 0 0.5em;
  }
  main {
    position: relative;
    margin: 0 auto;
    text-align: left;
  }
  a {
    color: #fff;
  }
  img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 0 1.2em;
  }
  .back {
    margin-bottom: 2em;
  }

  @media (max-width: 768px) {
    body {
      width: 80%;
      padding-top: 5%;
      padding-bottom: 5%;
    }
    main {
      padding-top: 7.5%;
      padding-bottom: 7.5%;
    }
  }

  @media (min-width: 769px) {
    body {
      width: 45%;
      padding-top: 2.5%;
      padding-bottom: 2.5%;
    }
    main {
      padding-top: 15%;
      padding-bottom: 15%;
    }
  }
</style>
</head>
<body>

<main>
  <p class="back"><a href="index.html">Indietro</a></p>

  <p style="margin-bottom:1.2em">Atramento</p>

  <p style="margin-bottom:1.6em">Text</p>
  
  <img src="Atramento1.jpg" alt="Atramento">
</main>

</body>
</html>
